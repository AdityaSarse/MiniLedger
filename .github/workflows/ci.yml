
name: ci

on:
  push:
    branches: [main]

jobs:

  # Backend Docker CI/CD
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/miniledger-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/miniledger-backend:${{ github.sha }}


  # Mobile Frontend CI
  mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate Expo project
        working-directory: mobile
        run: npx expo-doctor


  # Mobile Docker CI/CD
  mobile-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Mobile image
        uses: docker/build-push-action@v7
        with:
          context: ./mobile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/miniledger-mobile:latest
            ${{ vars.DOCKERHUB_USERNAME }}/miniledger-mobile:${{ github.sha }}
